name: OpenGlide Nav Build

on:
  push:
    branches: [main, dev, openglide-nav]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (UNIX)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xcsoar/xcsoar/xcsoar-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OpenGlide Nav (Linux)
        run: |
          make -j$(nproc) TARGET=UNIX VFB=y USE_CCACHE=y

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openglidenav-linux
          path: output/UNIX/bin/xcsoar

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo ./ide/provisioning/install-debian-packages.sh BASE
          sudo apt-get install -y vorbis-tools

      - name: Install Android SDK/NDK
        run: |
          ./ide/provisioning/install-android-tools.sh NDK
          ./ide/provisioning/install-android-tools.sh SDK

      - name: Build OpenGlide Nav (Android)
        run: |
          make -j$(nproc) TARGET=ANDROID USE_CCACHE=y DEBUG=y

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openglidenav-android
          path: output/ANDROID/bin/*.apk

  verify-branding:
    name: Verify branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ProductName.hpp
        run: |
          grep -q 'PRODUCT_NAME "OpenGlide Nav"' src/ProductName.hpp
          grep -q 'ANDROID_PACKAGE "org.openglide.nav"' src/ProductName.hpp
          echo "✓ Branding verified"
